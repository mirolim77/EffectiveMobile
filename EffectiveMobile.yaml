name: Effective Mobile
services:
  backend:
    build: ./backend
    container_name: backend-app
    restart: no
    init: true
    volumes:
       - ./backend:/app
       - /app/node_modules
    networks:
      - effective-mobile-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080 | grep -q 'Hello from Effective Mobile!' || exit 1"]      
      interval: 10s
      timeout: 5s
      retries: 5
      

  nginx:
    build: ./nginx
    image: nginx:latest
    container_name: frontend-nginx
    restart: no
    init: true
    ports:
      - '880:80'

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - effective-mobile-network
    depends_on:
      - backend

networks:
  effective-mobile-network:
    driver: bridge